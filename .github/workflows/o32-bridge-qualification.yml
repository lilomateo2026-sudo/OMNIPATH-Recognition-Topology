name: O32 Bridge Qualification

on:
  pull_request:
    paths:
      - "registry/omniverse_design_pathology_o32_bridge.json"
      - "verification/o32_bridge_verify.py"
      - "omnipath/recognition/**"
      - ".github/workflows/o32-bridge-qualification.yml"
  push:
    branches: [main]
    paths:
      - "registry/omniverse_design_pathology_o32_bridge.json"
      - "verification/o32_bridge_verify.py"
      - "omnipath/recognition/**"
      - ".github/workflows/o32-bridge-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: O32 bridge qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run recognition topology suite
        env:
          PYTHONPATH: omnipath/recognition
        run: python -m unittest discover -s omnipath/recognition/tests -p 'test_*.py' -v
      - name: Verify immutable O32 bridge identities
        run: python verification/o32_bridge_verify.py
