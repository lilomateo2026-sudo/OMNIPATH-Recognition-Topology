name: O87 V5 Cross-Machine Reproduction

on:
  push:
    paths:
      - 'verification/v5/o87_runner.py'
      - '.github/workflows/o87-v5-cross-machine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run O87-O89 reproduction
        env:
          O87_RUNNER_ID: ${{ matrix.os }}-py${{ matrix.python }}-${{ github.run_id }}
        run: python verification/v5/o87_runner.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: o87-evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: verification/v5/artifacts/
          if-no-files-found: error
          retention-days: 90
